name: CI

# Zmiany wyłącznie w dokumentacji, karcie zadania i materiałach źródłowych nie uruchamiają builda.
on:
  pull_request:
    paths-ignore: ['docs/**', 'kono-state/**', 'assets-src/**', 'README.md']
  push:
    branches: [main, 'skibiai/**']
    paths-ignore: ['docs/**', 'kono-state/**', 'assets-src/**', 'README.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typy i build
        run: npm run build

      - name: Audyt w headless Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run audit

      - name: Zrzuty z audytu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-output
          path: audit-output/
          if-no-files-found: ignore
